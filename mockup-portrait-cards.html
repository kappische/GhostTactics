<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; display:flex; align-items:center; justify-content:center;
       gap:40px; min-height:100vh; font-family:'Courier New',monospace; padding:20px; }

.phone {
    width:390px; height:844px;
    background:#050a14;
    border:3px solid #304060;
    border-radius:40px;
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow: 0 0 60px rgba(64,192,255,0.15);
    flex-shrink:0;
}

/* ── Game world ── */
.game-world {
    flex:1; background:#030810; position:relative; overflow:hidden;
    border-bottom:1px solid #1a3050;
}
.scanlines {
    position:absolute; inset:0; pointer-events:none; z-index:10;
    background: repeating-linear-gradient(to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
}

/* ── HUD strip ── */
.hud-strip {
    height:110px; background:#050a14;
    border-top:1px solid rgba(64,192,255,0.25);
    border-bottom:1px solid rgba(64,192,255,0.12);
    display:flex; align-items:stretch;
    padding:6px 6px; gap:5px;
    overflow-x:auto; overflow-y:hidden;
}

/* Portrait-first card */
.squad-card {
    flex-shrink:0; width:86px;
    border:1px solid rgba(64,192,255,0.18);
    border-radius:5px;
    background:rgba(0,8,20,0.8);
    display:flex; flex-direction:column;
    overflow:hidden; cursor:pointer;
    position:relative;
}
.squad-card.active {
    border-color:rgba(128,224,255,0.8);
    box-shadow:0 0 8px rgba(64,192,255,0.2) inset;
}
.squad-card.dead { opacity:0.35; }

/* portrait area */
.portrait-area {
    flex:1;
    position:relative;
    background:#030d1a;
    overflow:hidden;
    min-height:0;
}
/* CSS face */
.face {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
}
.face-head {
    width:44px; height:52px;
    border-radius:50% 50% 42% 42%;
    background:rgba(64,192,255,0.18);
    border:1px solid rgba(64,192,255,0.3);
    position:relative;
}
.face-eyes {
    position:absolute; top:16px; left:5px; right:5px;
    display:flex; justify-content:space-between;
}
.face-eye {
    width:9px; height:6px; border-radius:50%;
    background:rgba(64,192,255,0.5);
}
.face-mouth {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    width:14px; height:4px; border-radius:50%;
    background:rgba(64,192,255,0.3);
}
.hair-1 .face-head::after { content:''; position:absolute; top:-6px; left:3px; right:3px;
    height:10px; background:rgba(64,192,255,0.22); border-radius:50% 50% 0 0; }
.hair-2 .face-head::after { content:''; position:absolute; top:-4px; left:-2px; right:-2px;
    height:8px; background:rgba(64,192,255,0.2); border-radius:50% 50% 0 0; }
.hair-3 .face-head::before { content:''; position:absolute; top:-2px; right:2px;
    width:14px; height:6px; background:rgba(64,192,255,0.2); border-radius:3px; }
.beard-1 .face-head { border-bottom-width:3px; border-bottom-color:rgba(64,192,255,0.25); }

/* name + rank overlay */
.portrait-overlay {
    position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(transparent, rgba(3,10,25,0.92) 40%);
    padding:10px 4px 3px;
    display:flex; flex-direction:column; gap:1px;
}
.overlay-name {
    font-size:9.5px; font-weight:bold; color:#80e0ff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.2;
}
.overlay-rank {
    font-size:8px; color:#305870; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* bottom strip */
.card-bottom {
    padding:3px 4px 3px;
    display:flex; flex-direction:column; gap:2px;
    background:#040c1c;
    border-top:1px solid rgba(64,192,255,0.1);
}
.health-row { display:flex; align-items:center; gap:3px; }
.health-bar { flex:1; height:4px; background:rgba(64,192,255,0.1); border-radius:2px; overflow:hidden; }
.health-fill { height:100%; border-radius:2px; }
.health-num { font-size:9px; min-width:20px; text-align:right; }
.kills-status { display:flex; justify-content:space-between; align-items:center; }
.kills-txt { font-size:8.5px; color:#304858; }
.status-dot { font-size:8.5px; }

/* ── Controls ── */
.controls-bar {
    height:175px; background:rgba(5,10,20,0.97);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px 18px; gap:10px;
    border-top:1px solid rgba(64,192,255,0.1);
}
.joystick-zone {
    width:148px; height:148px; flex-shrink:0;
    border-radius:50%; border:2px solid rgba(64,192,255,0.28);
    background:rgba(64,192,255,0.035); position:relative;
}
.joystick-thumb {
    position:absolute; width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(64,192,255,0.5); background:rgba(64,192,255,0.14);
    top:50%; left:50%; transform:translate(-50%,-50%);
}
.j-arrow { position:absolute; font-size:13px; color:rgba(64,192,255,0.42); }
.action-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.act-btn {
    width:68px; height:68px;
    border:1px solid rgba(64,192,255,0.28); border-radius:10px;
    background:rgba(64,192,255,0.055);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; font-size:10px; color:#40c0ff;
    text-align:center; line-height:1.3; gap:2px;
}
.act-btn .icon { font-size:17px; }

.label {
    font-size:11px; color:rgba(64,192,255,0.55);
    text-align:center; margin-top:6px;
}
</style>
</head>
<body>

      <text x="34" y="450" font-size="8" fill="rgba(48,80,96,0.7)" font-family="Courier New">60 FPS</text>
    </svg>
  </div>

  <!-- HUD STRIP -->
  <div class="hud-strip">
